specVersion: "3.2"
metadata:
  name: zgpm-orderconf
type: application
framework:
  name: SAPUI5
  version: "1.71.84"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ndc
    - name: sap.ushell
      optional: true
    - name: themelib_sap_belize
      optional: true
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      mountPath: /sap
      afterMiddleware: compression
      configuration:
        baseUri: http://sdctwd0024.ad.ponet:8000
        client: "100"
        strictSSL: false
